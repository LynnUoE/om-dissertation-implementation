<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved papers · LitFinder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="js/common.js" defer></script>
    <script src="js/saved.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="index.html"><span class="brand-mark"><i class="fas fa-book-open"></i></span>LitFinder</a>
            <nav class="site-nav" aria-label="Main">
                <a href="index.html"><i class="fas fa-magnifying-glass"></i> <span class="label">Search</span></a>
                <a href="saved.html" class="active"><i class="far fa-bookmark"></i> <span class="label">Saved</span><span class="nav-count" id="saved-count"></span></a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="page-title">
                <h1>Saved papers</h1>
                <p>Papers you bookmark are kept in this browser.</p>
            </div>
            <div class="results-meta">
                <div class="count" id="saved-summary"></div>
                <div class="toolbar" id="saved-toolbar" hidden>
                    <button type="button" class="btn btn-ghost btn-sm" id="copy-all-bibtex"><i class="fas fa-code"></i> Copy all as BibTeX</button>
                    <button type="button" class="btn btn-ghost btn-sm" id="copy-all-citations"><i class="far fa-copy"></i> Copy all citations</button>
                    <button type="button" class="btn btn-ghost btn-sm" id="clear-saved"><i class="far fa-trash-can"></i> Clear all</button>
                </div>
            </div>
            <div class="paper-list" id="saved-list"></div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <span>Paper data from <a href="https://openalex.org" target="_blank" rel="noopener">OpenAlex</a></span>
            <a href="https://github.com/LynnUoE/om-dissertation-implementation" target="_blank" rel="noopener"><i class="fab fa-github"></i> Source on GitHub</a>
        </div>
    </footer>
</body>
</html>
