<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results · LitFinder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="js/common.js" defer></script>
    <script src="js/api-service.js" defer></script>
    <script src="js/search-form.js" defer></script>
    <script src="js/results.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="index.html"><span class="brand-mark"><i class="fas fa-book-open"></i></span>LitFinder</a>
            <nav class="site-nav" aria-label="Main">
                <a href="index.html"><i class="fas fa-magnifying-glass"></i> <span class="label">Search</span></a>
                <a href="saved.html"><i class="far fa-bookmark"></i> <span class="label">Saved</span><span class="nav-count" id="saved-count"></span></a>
            </nav>
        </div>
    </header>

    <main>
        <section class="results-top">
            <div class="container">
                <form id="search-form" class="search-box" novalidate></form>
                <div class="query-plan" id="query-plan" hidden></div>
            </div>
        </section>

        <section>
            <div class="container">
                <div id="status" aria-live="polite"></div>

                <div id="results" hidden>
                    <div class="results-meta">
                        <div class="count" id="results-count"></div>
                        <div class="toolbar">
                            <label class="sr-only" for="sort">Sort by</label>
                            <select class="input" id="sort">
                                <option value="relevance">Best match</option>
                                <option value="citations">Most cited</option>
                                <option value="newest">Newest</option>
                                <option value="oldest">Oldest</option>
                            </select>
                            <button type="button" class="btn btn-ghost btn-sm" id="refine-toggle" aria-expanded="false" aria-controls="refine-panel">
                                <i class="fas fa-filter"></i> Narrow down<span id="refine-count"></span>
                            </button>
                        </div>
                    </div>

                    <div class="refine-panel" id="refine-panel" hidden>
                        <div class="field">
                            <label class="field-label" for="refine-from">Published from</label>
                            <input class="input" type="number" id="refine-from" placeholder="Any">
                        </div>
                        <div class="field">
                            <label class="field-label" for="refine-citations">Min. citations</label>
                            <input class="input" type="number" id="refine-citations" min="0" placeholder="0">
                        </div>
                        <div class="field">
                            <label class="field-label" for="refine-type">Type</label>
                            <select class="input" id="refine-type"><option value="">Any type</option></select>
                        </div>
                        <label class="check"><input type="checkbox" id="refine-oa"> Open access only</label>
                        <button type="button" class="btn btn-ghost btn-sm" id="refine-clear">Clear</button>
                    </div>

                    <div class="results-layout" id="results-layout">
                        <div>
                            <div id="agent-card"></div>
                            <div class="paper-list" id="paper-list"></div>
                        </div>
                        <aside id="side" hidden></aside>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <span>Paper data from <a href="https://openalex.org" target="_blank" rel="noopener">OpenAlex</a></span>
            <a href="https://github.com/LynnUoE/om-dissertation-implementation" target="_blank" rel="noopener"><i class="fab fa-github"></i> Source on GitHub</a>
        </div>
    </footer>
</body>
</html>
